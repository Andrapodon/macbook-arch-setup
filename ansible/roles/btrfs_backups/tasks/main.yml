---
- name: Install btrfs utilities and btrbk
  community.general.pacman:
    name:
      - btrfs-progs
      - btrbk
    state: present

- name: Ensure snapshot directory exists
  ansible.builtin.file:
    path: "{{ btrbk.snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create /etc/btrbk configuration directory
  ansible.builtin.file:
    path: /etc/btrbk
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Generate SSH key for root to allow btrbk remote push
  ansible.builtin.user:
    name: root
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
  when: btrbk.remote_backup_enabled

- name: Deploy btrbk.conf configuration
  ansible.builtin.template:
    src: btrbk.conf.j2
    dest: /etc/btrbk/btrbk.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable and start btrbk.timer for automated scheduled backups
  ansible.builtin.systemd:
    name: btrbk.timer
    state: started
    enabled: true
